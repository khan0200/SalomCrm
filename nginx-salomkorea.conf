# ─────────────────────────────────────────────────────────────────────────────
# salomkorea.uz — SalomCRM public marketing site
#
# Serves the static build from `marketing/dist`. This host is the canonical
# home of the brand and the only property that should appear in search results;
# the application at crm.salomkorea.uz is deliberately kept out of the index.
#
# Deploy:
#   node marketing/build.mjs --check
#   rsync -a --delete marketing/dist/ /var/www/salomkorea/
#   cp nginx-salomkorea.conf /etc/nginx/sites-available/salomkorea.uz
#   ln -sf /etc/nginx/sites-available/salomkorea.uz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS is issued by certbot:
#   certbot --nginx -d salomkorea.uz -d www.salomkorea.uz
# ─────────────────────────────────────────────────────────────────────────────

# ── Port 80: ACME challenges, everything else redirected to HTTPS ────────────
server {
    listen 80;
    listen [::]:80;
    server_name salomkorea.uz www.salomkorea.uz;

    # Must stay on port 80 so certbot can renew.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://salomkorea.uz$request_uri;
    }
}

# ── www → apex, so one canonical hostname holds all the ranking signals ──────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.salomkorea.uz;

    ssl_certificate     /etc/letsencrypt/live/salomkorea.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salomkorea.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://salomkorea.uz$request_uri;
}

# ── The marketing site ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name salomkorea.uz;

    root /var/www/salomkorea;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/salomkorea.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salomkorea.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS. Start with a short max-age; raise to 31536000 once HTTPS is proven
    # stable on both this host and the crm subdomain.
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Compression. Cuts the inlined-CSS HTML documents by roughly 70%.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript image/svg+xml application/manifest+json;

    # ── Canonical URL shape ──────────────────────────────────────────────────
    # Directory-per-page means nginx issues the /features → /features/ redirect
    # itself. Force it to use the public hostname rather than an internal one.
    absolute_redirect off;

    # index.html is never a valid public URL — always redirect to the directory
    # form so the same page is not reachable at two addresses.
    location ~ ^(?<prefix>.*)/index\.html$ {
        return 301 $prefix/;
    }

    # ── Caching ──────────────────────────────────────────────────────────────
    # Fingerprint-free asset names, so cache for a week rather than a year and
    # let a rebuild propagate on its own.
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Crawler-facing files must never be served stale.
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        default_type "application/xml";
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type "application/manifest+json";
        try_files $uri =404;
    }

    # ── Pages ────────────────────────────────────────────────────────────────
    # `=404` rather than an SPA fallback: an unknown URL must return a real 404
    # so it is never indexed as a soft-404 duplicate of the home page.
    location / {
        add_header Cache-Control "public, max-age=600, must-revalidate";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
    }
}
