version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uniapp3_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uniapp3_db}
      POSTGRES_USER: ${POSTGRES_USER:-uniapp3_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uniapp3_secret_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uniapp3_user} -d ${POSTGRES_DB:-uniapp3_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uniapp3_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uniapp3_backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-uniapp3_production_secret_key_change_in_prod}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://${POSTGRES_USER:-uniapp3_user}:${POSTGRES_PASSWORD:-uniapp3_secret_pass}@postgres:5432/${POSTGRES_DB:-uniapp3_db}
      REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uniapp3_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
