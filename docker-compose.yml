version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: salomcrm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salomcrm_db}
      POSTGRES_USER: ${POSTGRES_USER:-salomcrm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SalomCrmSecret2026!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salomcrm_user} -d ${POSTGRES_DB:-salomcrm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: salomcrm_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salomcrm_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SECRET_KEY: ${SECRET_KEY:-salomcrm_production_secret_key_2026}
      DJANGO_DEBUG: ${DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DATABASE_URL: ${DATABASE_URL:-postgres://salomcrm_user:SalomCrmSecret2026!@postgres:5432/salomcrm_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: salomcrm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
  redis_data:
  backend_media:
