<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salom CRM — Educational CRM</title>

    <!--
      This is the private, login-gated application. It must never be indexed:
      every route requires authentication, so a crawler can only ever reach the
      login screen, and indexing it would compete with the public site.

      The public marketing site is https://salomkorea.uz — that is the property
      that should rank. Reinforced by robots.txt and an X-Robots-Tag header in
      nginx-salomcrm.conf; this tag is the last line of defence.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="description" content="Private workspace for SalomCRM. Sign in to manage students, payments and visa status." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased font-sans transition-colors duration-200">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
