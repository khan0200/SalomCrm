# ─────────────────────────────────────────────────────────────────────────────
# crm.salomkorea.uz — SalomCRM application
#
# This host serves the authenticated Vue application. Every route behind `/` is
# login-gated, so there is nothing here worth indexing and a good deal that
# should not be: the login page, the Django admin, and the generated OpenAPI
# documentation.
#
# It is therefore excluded from search engines at three levels — a robots.txt
# that disallows everything, an X-Robots-Tag response header, and a noindex
# meta tag in the application's index.html. The public brand presence lives on
# salomkorea.uz (see nginx-salomkorea.conf).
#
# TLS:
#   certbot --nginx -d crm.salomkorea.uz
# ─────────────────────────────────────────────────────────────────────────────

# ── Port 80: ACME challenges, everything else redirected to HTTPS ────────────
server {
    listen 80;
    listen [::]:80;
    server_name crm.salomkorea.uz 178.238.231.210;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://crm.salomkorea.uz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.salomkorea.uz;

    ssl_certificate     /etc/letsencrypt/live/crm.salomkorea.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.salomkorea.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend build
    root /var/www/SalomCrm/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # ── Keep this host out of every search index ─────────────────────────────
    # `always` so the header is present on redirects and error responses too,
    # which is where a crawler most often lands.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Served inline so it cannot be swallowed by the SPA fallback below.
    location = /robots.txt {
        add_header Content-Type "text/plain";
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "# crm.salomkorea.uz is the SalomCRM application.\n# It is private and intentionally excluded from search engines.\n# The public site is https://salomkorea.uz\n\nUser-agent: *\nDisallow: /\n\nSitemap: https://salomkorea.uz/sitemap.xml\n";
    }

    # No sitemap on this host. Answer explicitly rather than letting the SPA
    # fallback return a 200 page pretending to be one.
    location = /sitemap.xml {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # ── Backend ──────────────────────────────────────────────────────────────
    # The OpenAPI schema and its two doc viewers describe the whole API surface.
    # They are public on this host today; keep crawlers off them at minimum.
    #
    # To close them off entirely — recommended for production — uncomment the
    # deny block. Developers can still reach them through an SSH tunnel to
    # 127.0.0.1:8000, and `/api/docs/` is unused by the application itself.
    location ~ ^/api/(docs|redoc|schema)/? {
        add_header X-Robots-Tag "noindex, nofollow" always;

        # deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin proxy
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Collected Static files
    location /static/ {
        alias /var/www/SalomCrm/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # User uploaded Media files.
    # Student documents live here — never let them be indexed.
    location /media/ {
        alias /var/www/SalomCrm/backend/media/;
        add_header X-Robots-Tag "noindex, nofollow, noimageindex" always;
        expires 30d;
        access_log off;
    }

    # ── SPA routing ──────────────────────────────────────────────────────────
    # A missing file with an extension is a genuine 404, not a client route.
    # Without this, `try_files … /index.html` answers 200 for every URL on the
    # host — an unbounded soft-404 space for any crawler that wanders in.
    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot|json|txt|xml|pdf|xlsx?|zip)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
