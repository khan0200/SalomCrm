server {
    listen 80;
    server_name crm.salomkorea.uz 178.238.231.210;

    # Frontend build
    root /var/www/SalomCrm/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy to PM2 Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin proxy
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Collected Static files
    location /static/ {
        alias /var/www/SalomCrm/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # User uploaded Media files
    location /media/ {
        alias /var/www/SalomCrm/backend/media/;
        expires 30d;
        access_log off;
    }
}
